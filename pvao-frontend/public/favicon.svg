<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#E0A85E" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Lens Flare Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Gold Rim -->
  <rect width="64" height="64" rx="14" fill="url(#spaceGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Background Celestial Details: Distant Stars -->
  <circle cx="15" cy="18" r="0.8" fill="#F8FAFC" opacity="0.6" />
  <circle cx="28" cy="12" r="1" fill="#38BDF8" opacity="0.7" />
  <circle cx="12" cy="38" r="0.8" fill="#F8FAFC" opacity="0.5" />
  <circle cx="56" cy="46" r="0.8" fill="#F8FAFC" opacity="0.5" />

  <!-- Target Starburst (where telescope points) -->
  <g transform="translate(48, 14)">
    <circle cx="0" cy="0" r="3" fill="#38BDF8" opacity="0.4" filter="url(#glow)" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" filter="url(#starGlow)" />
    <!-- 4-point star flare -->
    <path d="M 0,-7 L 1.2,-1.5 L 7,0 L 1.2,1.5 L 0,7 L -1.2,1.5 L -7,0 L -1.2,-1.5 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="4" cy="-4" r="0.7" fill="#FDE047" opacity="0.8" />
  </g>

  <!-- Faint Light Beam Cone from Lens to Star -->
  <polygon points="35,23 48,14 40,30" fill="url(#cyanGrad)" opacity="0.12" />

  <!-- TELESCOPE ASSEMBLY -->
  <!-- Tripod Legs -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
    <!-- Center Leg -->
    <line x1="28" y1="39" x2="28" y2="56" stroke="url(#goldGrad)" stroke-width="2.2" />
    <!-- Left Leg -->
    <line x1="28" y1="39" x2="14" y2="56" />
    <!-- Right Leg -->
    <line x1="28" y1="39" x2="42" y2="56" />
    <!-- Tripod Spreader / Tray Bar -->
    <line x1="20" y1="48" x2="36" y2="48" stroke="#64748B" stroke-width="1.5" />
  </g>

  <!-- Mount / Hub -->
  <circle cx="28" cy="38" r="3.5" fill="url(#goldGrad)" />
  <circle cx="28" cy="38" r="1.5" fill="#0B0F19" />

  <!-- Main Optical Tube (Angled at ~40 deg) -->
  <!-- Transform group for tube aligned along axis -->
  <g transform="rotate(-38 28 35)">
    <!-- Finderscope mounted on top -->
    <rect x="22" y="22" width="14" height="2.5" rx="1" fill="#38BDF8" />
    <line x1="25" y1="24.5" x2="25" y2="28" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="33" y1="24.5" x2="33" y2="28" stroke="#38BDF8" stroke-width="1.2" />

    <!-- Main Barrel -->
    <rect x="18" y="27" width="26" height="8.5" rx="2" fill="url(#goldGrad)" />
    
    <!-- Accent Ring Bands -->
    <rect x="26" y="26.5" width="2" height="9.5" rx="0.5" fill="#0B0F19" opacity="0.7" />
    <rect x="36" y="26.5" width="2.5" height="9.5" rx="0.5" fill="#38BDF8" />

    <!-- Dew Shield / Objective Lens Front -->
    <rect x="42" y="26" width="4.5" height="10.5" rx="1.5" fill="#F8FAFC" />
    <!-- Lens Glow Front -->
    <ellipse cx="46.5" cy="31.25" rx="1.2" ry="5.25" fill="#38BDF8" />

    <!-- Eyepiece / Focuser (Back) -->
    <rect x="13" y="29.5" width="5" height="3.5" rx="1" fill="#64748B" />
    <!-- Diagonal & Eyepiece tube -->
    <rect x="11" y="26.5" width="3.5" height="6.5" rx="1" fill="url(#goldGrad)" />
  </g>
</svg>
